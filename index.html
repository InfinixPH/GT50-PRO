<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Infinix GT50 Pro – Mechanics</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --neon: #00e5ff;
      --neon-glow: rgba(0, 229, 255, 0.35);
      --green: #39ff14;
      --dark: #050a10;
      --panel: rgba(8, 18, 30, 0.92);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--dark);
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Scanline overlay ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0, 0, 0, 0.08) 3px,
        rgba(0, 0, 0, 0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* ── Nav bar ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 32px;
      background: rgb(5, 10, 16);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 229, 255, 0.15);
    }

    nav .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    nav .brand img {
      display: block;
    }

    nav .brand .logo-infinix {
      height: 22px;
      width: auto;
      filter: invert(1);
      mix-blend-mode: screen;
    }

    nav .brand .logo-sep {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.3);
      flex-shrink: 0;
      margin: 0 4px;
    }

    nav .brand .logo-gt50 {
      height: 18px;
      width: auto;
      mix-blend-mode: lighten;
      filter: brightness(1.4) contrast(1.2);
    }

    nav .links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    nav .links a {
      text-decoration: none;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      transition: color 0.2s;
    }

    nav .links a:hover {
      color: var(--neon);
    }

    #hero {
      padding-top: 0;
    }

    /* ── Image sections ── */
    .img-section {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 20px;
      overflow: hidden;
    }

    .img-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(0,229,255,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .img-wrapper {
      position: relative;
      max-width: 780px;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(0, 229, 255, 0.2),
        0 0 40px rgba(0, 229, 255, 0.12),
        0 20px 60px rgba(0, 0, 0, 0.6);
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .img-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Corner accent decorations */
    .img-wrapper::before,
    .img-wrapper::after {
      content: '';
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 2;
      pointer-events: none;
    }

    .img-wrapper::before {
      top: 0; left: 0;
      border-top: 2px solid var(--neon);
      border-left: 2px solid var(--neon);
      border-radius: 18px 0 0 0;
    }

    .img-wrapper::after {
      bottom: 0; right: 0;
      border-bottom: 2px solid var(--neon);
      border-right: 2px solid var(--neon);
      border-radius: 0 0 18px 0;
    }

    .img-wrapper img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* Neon line separator between sections */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 40px;
      opacity: 0;
      transform: scaleX(0.6);
      transition: opacity 0.6s ease 0.2s, transform 0.6s ease 0.2s;
    }

    .divider.visible {
      opacity: 1;
      transform: scaleX(1);
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--neon), transparent);
    }

    .divider-icon {
      width: 10px;
      height: 10px;
      border: 1px solid var(--neon);
      transform: rotate(45deg);
      box-shadow: 0 0 8px var(--neon-glow);
      background: var(--dark);
    }

    /* ── Hashtag strip ── */
    #hashtags {
      text-align: center;
      padding: 28px 20px 16px;
    }

    #hashtags p {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.35);
      text-transform: uppercase;
      line-height: 2.2;
    }

    #hashtags p span {
      color: var(--neon);
      opacity: 0.7;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 24px 20px 36px;
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.2);
      text-transform: uppercase;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    footer a {
      color: var(--neon);
      opacity: 0.6;
      text-decoration: none;
    }

    /* Ambient glow blobs */
    .glow-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .glow-blob-1 {
      width: 400px; height: 400px;
      background: rgba(0, 229, 255, 0.05);
      top: -100px; left: -100px;
    }

    .glow-blob-2 {
      width: 500px; height: 500px;
      background: rgba(57, 255, 20, 0.03);
      bottom: -150px; right: -150px;
    }

    /* ── Countdown ── */
    #countdown-section {
      text-align: center;
      padding: 100px 20px 40px; /* top accounts for fixed nav */
      position: relative;
    }

    .countdown-label {
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      color: rgba(255, 255, 255, 0.45);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .countdown-grid {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .countdown-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 12px;
      padding: 16px 0;
      width: 80px;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.08);
      flex-shrink: 0;
    }

    .countdown-num {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--neon);
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.6), 0 0 40px rgba(0, 229, 255, 0.3);
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      width: 2.5ch;
      text-align: center;
      display: inline-block;
    }

    .countdown-unit {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 6px;
      text-transform: uppercase;
    }

    .countdown-colon {
      font-size: 2rem;
      font-weight: 800;
      color: rgba(0, 229, 255, 0.4);
      margin-bottom: 18px;
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.1; }
    }

    .live-msg {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      color: var(--neon);
      text-shadow: 0 0 30px rgba(0, 229, 255, 0.8);
      animation: pulse-glow 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulse-glow {
      from { text-shadow: 0 0 20px rgba(0, 229, 255, 0.6); }
      to   { text-shadow: 0 0 50px rgba(0, 229, 255, 1), 0 0 80px rgba(0, 229, 255, 0.5); }
    }

    @media (max-width: 600px) {
      /* Nav */
      nav { padding: 10px 16px; }
      nav .brand .logo-infinix { height: 18px; }
      nav .brand .logo-gt50 { height: 14px; }
      nav .brand { gap: 8px; }
      nav .links { gap: 14px; }
      nav .links a { font-size: 0.68rem; letter-spacing: 0.08em; }

      /* Countdown */
      #countdown-section { padding: 80px 12px 28px; }
      .countdown-label { font-size: 0.62rem; letter-spacing: 0.18em; margin-bottom: 14px; }
      .countdown-block { min-width: 0; width: 68px; padding: 10px 0; border-radius: 10px; }
      .countdown-num { font-size: 2rem; }
      .countdown-unit { font-size: 0.5rem; letter-spacing: 0.12em; margin-top: 4px; }
      .countdown-colon { font-size: 1.4rem; margin-bottom: 14px; }
      .countdown-grid { gap: 5px; }
      .live-msg { font-size: 1rem; letter-spacing: 0.08em; padding: 0 12px; }

      /* Images */
      .img-section { padding: 16px 10px; }
      .img-wrapper { border-radius: 12px; }

      /* Hashtags */
      #hashtags p { font-size: 0.6rem; letter-spacing: 0.1em; line-height: 2; }

      /* Footer */
      footer { font-size: 0.6rem; padding: 18px 12px 28px; }
    }

    /* Extra small screens (iPhone SE etc) */
    @media (max-width: 380px) {
      .countdown-block { width: 58px; padding: 8px 0; }
      .countdown-num { font-size: 1.7rem; }
      .countdown-grid { gap: 3px; }
      .countdown-colon { font-size: 1.2rem; }
    }
  </style>
</head>
<body>

  <!-- Ambient background blobs -->
  <div class="glow-blob glow-blob-1"></div>
  <div class="glow-blob glow-blob-2"></div>

  <!-- Nav -->
  <nav>
    <div class="brand">
      <img
        src="https://raw.githubusercontent.com/InfinixPH/GT50-PRO/main/infinix.png"
        alt="Infinix"
        class="logo-infinix"
      />
      <div class="logo-sep"></div>
      <img
        src="https://raw.githubusercontent.com/InfinixPH/GT50-PRO/main/gt50%20pro.png"
        alt="GT50 Pro"
        class="logo-gt50"
      />
    </div>
    <ul class="links">
      <li><a href="#hero">Pre-order</a></li>
      <li><a href="#mechanics">Mechanics</a></li>
    </ul>
  </nav>

  <!-- Countdown Timer -->
  <section id="countdown-section">
    <p class="countdown-label">PRE-ORDER STARTS IN</p>
    <div id="countdown-live" class="countdown-grid">
      <div class="countdown-block">
        <span class="countdown-num" id="cd-days">00</span>
        <span class="countdown-unit">DAYS</span>
      </div>
      <div class="countdown-colon">:</div>
      <div class="countdown-block">
        <span class="countdown-num" id="cd-hours">00</span>
        <span class="countdown-unit">HOURS</span>
      </div>
      <div class="countdown-colon">:</div>
      <div class="countdown-block">
        <span class="countdown-num" id="cd-mins">00</span>
        <span class="countdown-unit">MINS</span>
      </div>
      <div class="countdown-colon">:</div>
      <div class="countdown-block">
        <span class="countdown-num" id="cd-secs">00</span>
        <span class="countdown-unit">SECS</span>
      </div>
    </div>
    <div id="countdown-live-msg" class="live-msg" style="display:none;">
      🎮 PRE-ORDER IS NOW LIVE!
    </div>
  </section>

  <!-- Hero / Top image (down.png = promo poster) -->
  <section id="hero" class="img-section">
    <div class="img-wrapper" id="img-top">
      <img
        src="https://raw.githubusercontent.com/InfinixPH/GT50-PRO/main/down.png"
        alt="Infinix GT50 Pro – Unleash the Liquid Cooling Beast"
        loading="eager"
      />
    </div>
  </section>

  <!-- Divider -->
  <div class="divider" id="divider-1">
    <div class="divider-line"></div>
    <div class="divider-icon"></div>
    <div class="divider-line"></div>
  </div>

  <!-- Mechanics image (top.png) -->
  <section id="mechanics" class="img-section">
    <div class="img-wrapper" id="img-bottom">
      <img
        src="https://raw.githubusercontent.com/InfinixPH/GT50-PRO/main/top.png"
        alt="Infinix GT50 Pro – Pre-order Mechanics"
        loading="lazy"
      />
    </div>
  </section>

  <!-- Hashtag strip -->
  <div id="hashtags">
    <p>
      <span>#InfinixGT50Pro</span> &nbsp;|&nbsp;
      <span>#UnleashTheLiquidCoolingBeast</span> &nbsp;|&nbsp;
      <span>#MPLOfficialGamingPhone</span>
    </p>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 Infinix Mobile &nbsp;·&nbsp;
    <a href="https://github.com/InfinixPH/GT50-PRO" target="_blank" rel="noopener">
      GitHub
    </a>
    &nbsp;·&nbsp; T&amp;C Apply
  </footer>

  <script>
    // Intersection Observer for fade-in animations
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.img-wrapper, .divider').forEach(el => {
      observer.observe(el);
    });

    // Countdown to May 29, 2026 00:00:00 Philippine Time (UTC+8)
    const targetPHT = new Date('2026-05-29T00:00:00+08:00').getTime();

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateCountdown() {
      const now = Date.now();
      const diff = targetPHT - now;

      if (diff <= 0) {
        document.getElementById('countdown-live').style.display = 'none';
        document.getElementById('countdown-live-msg').style.display = 'block';
        return;
      }

      const days  = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins  = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const secs  = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('cd-days').textContent  = pad(days);
      document.getElementById('cd-hours').textContent = pad(hours);
      document.getElementById('cd-mins').textContent  = pad(mins);
      document.getElementById('cd-secs').textContent  = pad(secs);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
